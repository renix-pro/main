<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <script>
      (function(){try{
        var t=localStorage.getItem('renix-theme');
        var d=t==='dark';
        if(d){
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor='#121621';
          var m=document.getElementById('theme-color-meta');
          if(m)m.setAttribute('content','#121621');
        }else{
          document.documentElement.style.backgroundColor='#ffffff';
        }
      }catch(e){}})();
    </script>
    <title>RENIX — AI-Powered Renovation Management</title>
    <meta name="description" content="Manage your renovation from vision to completion. RENIX is an AI-powered construction management platform that helps you plan scope, track budgets, process quotes, and control every financial decision.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="RENIX — AI-Powered Renovation Management">
    <meta property="og:description" content="Manage your renovation from vision to completion. AI-powered scope planning, budget tracking, quote extraction, and financial control for sophisticated homeowners.">
    <meta property="og:site_name" content="RENIX">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RENIX — AI-Powered Renovation Management">
    <meta name="twitter:description" content="Manage your renovation from vision to completion. AI-powered scope planning, budget tracking, quote extraction, and financial control.">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
